name: Renovate
version: "1.2.0"
slug: renovate
description: Maintient vos dépôts GitHub à jour, avec incrément de version, journal des modifications dans chaque PR et un panneau listant les mises à jour en attente
url: https://github.com/pier-andre/renovate-ha-addon/tree/main/renovate
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Le panneau est servi en ingress uniquement : rien n'est exposé sur le réseau local.
ingress: true
ingress_port: 8099
panel_title: Renovate
panel_icon: mdi:robot-outline
panel_admin: true
options:
  github_token: ""
  repositories: []
  run_on_start: true
  schedule_days: all
  schedule_time: "04:00"
  timezone: Europe/Paris
  dry_run: false
  log_level: info
schema:
  github_token: password
  repositories:
    - str
  run_on_start: bool
  schedule_days: list(all|weekdays|weekends|mon|tue|wed|thu|fri|sat|sun)
  schedule_time: str
  timezone: str
  dry_run: bool
  log_level: list(debug|info|warn|error)
