name: Renovate
version: "1.1.0"
slug: renovate
description: Maintient vos dépôts GitHub à jour, avec incrément de version et journal des modifications dans chaque PR
url: https://github.com/pier-andre/renovate-ha-addon/tree/main/renovate
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
options:
  github_token: ""
  repositories: []
  run_on_start: true
  schedule_days: all
  schedule_time: "04:00"
  timezone: Europe/Paris
  dry_run: false
  log_level: info
schema:
  github_token: password
  repositories:
    - str
  run_on_start: bool
  schedule_days: list(all|weekdays|weekends|mon|tue|wed|thu|fri|sat|sun)
  schedule_time: str
  timezone: str
  dry_run: bool
  log_level: list(debug|info|warn|error)
